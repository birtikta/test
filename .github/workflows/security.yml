# ===========================================
# 🔐 Security & Code Quality Pipeline
# ===========================================
# Bu workflow her push ve PR'da çalışır
# Araçlar: GitLeaks, CodeQL, PHPStan

name: 🔐 Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Her Pazartesi 09:00'da çalışır (haftalık tarama)
    - cron: '0 9 * * 1'

jobs:
  # =========================================
  # 1️⃣ GitLeaks - Secret Detection
  # =========================================
  gitleaks:
    name: 🔑 GitLeaks - Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tüm git geçmişini al

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================
  # 2️⃣ PHPStan - PHP Static Analysis
  # =========================================
  phpstan:
    name: 🔍 PHPStan - Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpstan

      - name: Run PHPStan
        run: phpstan analyse index.php --level=5 --error-format=github --no-progress

  # =========================================
  # 3️⃣ Semgrep - Ek Güvenlik Taraması
  # =========================================
  semgrep:
    name: 🔬 Semgrep - Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/php
